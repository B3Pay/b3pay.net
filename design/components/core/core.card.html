<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0;background:var(--background)}#root{padding:20px;font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const B = window.B3PayDesignSystem_8a84cb;
const {Button,Badge,Card,CardHeader,CardContent,CardFooter,Kbd,CodeBlock,IconOf}=B;
const icon = IconOf;
function Demo(){return(<div className="col" style={{gap:18}}>
<div className="col" style={{gap:6}}><span className="lbl">Button — variant × colour</span>
{["default","filled","outlined","ghost"].map(v=>(<div className="row" key={v}>
{["primary","secondary","error","success","warning","info"].map(c=>(<Button key={c} variant={v} color={c} size="sm">{c}</Button>))}
</div>))}</div>
<div className="col" style={{gap:6}}><span className="lbl">Sizes · states · icons</span><div className="row">
{["xs","sm","md","lg","xl"].map(s=>(<Button key={s} size={s} variant="filled" color="primary">{s}</Button>))}
<Button variant="outlined" icon={icon("Play")}>Run</Button>
<Button asIconButton icon={icon("Settings")} aria-label="Settings"/>
<Button isActive color="primary">Active</Button>
<Button isLoading color="primary">Loading</Button>
<Button variant="filled" color="primary" isLoading>Paying</Button>
<Button disabled>Disabled</Button>
<Button variant="filled" color="primary" bevel>Bevel</Button>
</div></div>
<div className="row" style={{gap:6}}><span className="lbl" style={{width:60}}>Badge</span>
<Badge color="success" dot>Live</Badge><Badge color="warning" variant="outlined">Beta</Badge>
<Badge color="primary" variant="filled">ckBTC</Badge><Badge color="info" size="xs">v1.2.0</Badge>
<Badge color="muted" size="md">Archived</Badge><Kbd>⌘</Kbd><Kbd>K</Kbd></div>
<div className="row" style={{gap:12,alignItems:"stretch"}}>
<Card interactive style={{width:250}}><CardHeader title="Token transfer" description="Balance check, then transfer." icon={icon("Coins")} action={<Badge color="success">Public</Badge>}/><CardFooter><Button size="sm" variant="filled" color="primary">Run</Button><Button size="sm" variant="outlined">Fork</Button></CardFooter></Card>
<CodeBlock style={{flex:1}} filename="terminal" code={"pnpm add @ic-reactor/react\npnpm add @icp-sdk/core"}/>
</div></div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>

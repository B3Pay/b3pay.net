<!-- @dsCard group="Brand" viewport="700x150" name="Gradient & selection" subtitle="One brand gradient. Never purple, never blue." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="row" style="gap:12px;align-items:stretch">
<div class="sw" style="flex:2"><div style="height:56px;border-radius:var(--radius-md);background:var(--gradient-brand)"></div><span class="n">--gradient-brand · forge-700 → forge-500 → forge-300</span></div>
<div class="sw" style="flex:1"><div style="height:56px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--border);display:grid;place-items:center"><span style="font-family:var(--font-display);font-size:20px;font-weight:700;background:var(--gradient-brand);-webkit-background-clip:text;background-clip:text;color:transparent">chain-key</span></div><span class="n">text-gradient</span></div>
<div class="sw" style="flex:1"><div style="height:56px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:13px"><span style="background:var(--forge-600);color:#150800;padding:2px 4px">selected text</span></div><span class="n">::selection</span></div>
</div></body></html>

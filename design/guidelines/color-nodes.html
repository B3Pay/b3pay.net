<!-- @dsCard group="Colors" viewport="700x150" name="Workflow node accents" subtitle="Fixed per node kind — engineers read the graph by colour" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--node-trigger);border-color:transparent"></div><span class="n">trigger</span><span class="v">#F59E0B</span></div><div class="sw"><div class="chip" style="background:var(--node-variables);border-color:transparent"></div><span class="n">variables</span><span class="v">#8B5CF6</span></div><div class="sw"><div class="chip" style="background:var(--node-query);border-color:transparent"></div><span class="n">query</span><span class="v">#2563EB</span></div><div class="sw"><div class="chip" style="background:var(--node-update);border-color:transparent"></div><span class="n">update</span><span class="v">#F97316</span></div><div class="sw"><div class="chip" style="background:var(--node-utility);border-color:transparent"></div><span class="n">utility</span><span class="v">#10B981</span></div>
</div><p class="v" style="margin:12px 0 0">These five never change and never take the Forge orange. They are the only place in the system where a hue outside the brand palette is allowed.</p></body></html>

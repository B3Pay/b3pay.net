<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Semantic hues, exactly as the B3Forge app defines them" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--error);border-color:transparent"></div><span class="n">error</span><span class="v">Reject, destroy</span></div><div class="sw"><div class="chip" style="background:var(--success);border-color:transparent"></div><span class="n">success</span><span class="v">Deployed, verified</span></div><div class="sw"><div class="chip" style="background:var(--warning);border-color:transparent"></div><span class="n">warning</span><span class="v">Beta, cycles low</span></div><div class="sw"><div class="chip" style="background:var(--info);border-color:transparent"></div><span class="n">info</span><span class="v">Neutral notice</span></div><div class="sw"><div class="chip" style="background:var(--alert);border-color:transparent"></div><span class="n">alert</span><span class="v">Needs attention</span></div>
</div>
<div class="row" style="margin-top:10px;gap:6px">
<span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--error) 12%,transparent);color:var(--error);border:1px solid color-mix(in srgb,var(--error) 28%,transparent)">error</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 28%,transparent)">success</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning);border:1px solid color-mix(in srgb,var(--warning) 28%,transparent)">warning</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 28%,transparent)">info</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--alert) 12%,transparent);color:var(--alert);border:1px solid color-mix(in srgb,var(--alert) 28%,transparent)">alert</span>
</div></body></html>

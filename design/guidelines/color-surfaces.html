<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">
<div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--background);border:1px solid var(--border);flex:none"></div><div><div class="n">--background</div><div class="v">Page</div></div></div><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--card);border:1px solid var(--border);flex:none"></div><div><div class="n">--card</div><div class="v">Panels, list rows</div></div></div><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--popover);border:1px solid var(--border);flex:none"></div><div><div class="n">--popover</div><div class="v">Menus, dialogs, tooltips</div></div></div><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--secondary);border:1px solid var(--border);flex:none"></div><div><div class="n">--secondary</div><div class="v">Tab tray, key caps</div></div></div><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--muted);border:1px solid var(--border);flex:none"></div><div><div class="n">--muted</div><div class="v">Disabled fills</div></div></div><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--primary);border:1px solid var(--border);flex:none"></div><div><div class="n">--primary</div><div class="v">The one CTA</div></div></div>
</div></body></html>

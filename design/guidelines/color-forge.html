<!-- @dsCard group="Colors" viewport="700x150" name="Forge ramp" subtitle="The brand orange, straight from the Figma variables" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="grid" style="grid-template-columns:repeat(7,1fr)">
<div class="sw"><div class="chip" style="background:var(--forge-300);border-color:transparent"></div><span class="n">300 IC-Dark</span><span class="v">#FFA056</span></div><div class="sw"><div class="chip" style="background:var(--forge-400);border-color:transparent"></div><span class="n">400 Dark</span><span class="v">#FF9230</span></div><div class="sw"><div class="chip" style="background:var(--forge-500);border-color:transparent"></div><span class="n">500 Accent</span><span class="v">#FF8D28</span></div><div class="sw"><div class="chip" style="background:var(--forge-600);border-color:transparent"></div><span class="n">600 PRIMARY</span><span class="v">#ED7437</span></div><div class="sw"><div class="chip" style="background:var(--forge-700);border-color:transparent"></div><span class="n">700 Light</span><span class="v">#C55300</span></div><div class="sw"><div class="chip" style="background:var(--forge-800);border-color:transparent"></div><span class="n">800 </span><span class="v">#8A3A00</span></div><div class="sw"><div class="chip" style="background:var(--forge-900);border-color:transparent"></div><span class="n">900 </span><span class="v">#3D1A00</span></div>
</div><p class="v" style="margin:12px 0 0">forge-600 is the primary. forge-500 is the accent and focus ring. Only one Forge surface per view — orange is signal, not decoration.</p></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Ink ramp" subtitle="Cool near-black neutral axis — the brand surface" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="grid" style="grid-template-columns:repeat(11,1fr)">
<div class="sw"><div class="chip" style="background:var(--ink-050)"></div><span class="n">050</span></div><div class="sw"><div class="chip" style="background:var(--ink-100)"></div><span class="n">100</span></div><div class="sw"><div class="chip" style="background:var(--ink-150)"></div><span class="n">150</span></div><div class="sw"><div class="chip" style="background:var(--ink-200)"></div><span class="n">200</span></div><div class="sw"><div class="chip" style="background:var(--ink-250)"></div><span class="n">250</span></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><span class="n">300</span></div><div class="sw"><div class="chip" style="background:var(--ink-400)"></div><span class="n">400</span></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><span class="n">500</span></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><span class="n">700</span></div><div class="sw"><div class="chip" style="background:var(--ink-800)"></div><span class="n">800</span></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><span class="n">900</span></div>
</div><p class="v" style="margin:12px 0 0">ink-100 <b style="color:var(--ink-800)">#111111</b> is the brand near-black from the logo artboards. ink-150 is the app background, ink-200 the card, ink-400 the border, ink-700 muted text.</p></body></html>

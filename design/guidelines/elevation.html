<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="row" style="gap:14px">
<div class="sw"><div style="width:130px;height:52px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-xs)"></div><span class="n">shadow-xs</span><span class="v">Input rest</span></div><div class="sw"><div style="width:130px;height:52px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><span class="n">shadow-sm</span><span class="v">Outlined button</span></div><div class="sw"><div style="width:130px;height:52px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><span class="n">shadow-md</span><span class="v">Card hover</span></div><div class="sw"><div style="width:130px;height:52px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><span class="n">shadow-lg</span><span class="v">Dialog, menu</span></div>
<div class="sw"><div style="width:130px;height:52px;background:var(--forge-600);border-radius:var(--radius-md);box-shadow:var(--glow-forge-sm)"></div><span class="n">glow-forge-sm</span><span class="v">Primary hover</span></div>
</div></body></html>

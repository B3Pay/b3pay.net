<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Derived from --radius: 10px. Never snapped to a 4px grid." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--background);color:var(--foreground)}body{padding:18px;font-family:var(--font-sans)}.sw{display:flex;flex-direction:column;gap:5px}.chip{height:44px;border-radius:var(--radius-sm);border:1px solid var(--hairline)}.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--muted-foreground);white-space:nowrap}.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-600)}.row{display:flex;gap:8px}.grid{display:grid;gap:8px}</style></head><body><div class="row" style="gap:12px">
<div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xs)"></div><span class="n">xs 4px</span></div><div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><span class="n">sm 6px</span></div><div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md)"></div><span class="n">md 8px</span></div><div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)"></div><span class="n">lg 10px</span></div><div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl)"></div><span class="n">xl 14px</span></div><div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-2xl)"></div><span class="n">2xl 20px</span></div><div class="sw" style="align-items:center"><div style="width:60px;height:44px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-full)"></div><span class="n">full ∞</span></div>
</div><p class="v" style="margin:12px 0 0">Radius scales with control size: xs buttons get radius-xs, xl buttons radius-xl. Cards use radius-lg, dialogs radius-xl.</p></body></html>
